<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../fonts/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#14213D}
.b{position:absolute;border-radius:50%;filter:blur(110px);opacity:.75}
.b1{width:900px;height:900px;background:#FFD6DF;left:-260px;top:-360px}.b2{width:820px;height:820px;background:#D8E7FF;right:-200px;top:-120px}.b3{width:760px;height:760px;background:#FFF0C2;left:640px;bottom:-560px}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:150px}
.k{font-weight:800;font-size:28px;letter-spacing:.3em;color:#FF4D6D;text-transform:uppercase}
h1{font-weight:800;font-size:118px;line-height:1;letter-spacing:-.045em;margin:22px 0 0}
.t{font-weight:800;font-size:50px;letter-spacing:-.02em;margin-top:28px;background:linear-gradient(95deg,#FF4D6D,#FF8E3C);-webkit-background-clip:text;color:transparent}
.logos{margin-top:74px;display:flex;flex-direction:column;align-items:center;gap:52px}
.lab{font-weight:800;font-size:22px;letter-spacing:.28em;color:#8A93A6;text-transform:uppercase;margin-bottom:18px}
.mptc{background:#14213D;border-radius:26px;padding:22px 40px;box-shadow:0 18px 40px rgba(20,33,61,.18)}
.mptc img{height:104px;display:block}
.row{display:flex;align-items:center;gap:72px}
.row .cadt{height:118px}
.row .aupp{height:104px}
.row .nm{height:46px}
.sep{width:2px;height:84px;background:#E2E7F0;border-radius:2px}
</style></head><body>
<div class="b b1"></div><div class="b b2"></div><div class="b b3"></div>
<div class="wrap">
  <div class="k">Welcome to</div>
  <h1>Japanese IT Pathway Program</h1>
  <div class="t">Your Future. Your Opportunity. Your Commitment.</div>
  <div class="logos">
    <div><div class="lab">Supported by</div><div class="mptc"><img src="mptc_logo.png" alt="Ministry of Post and Telecommunications"></div></div>
    <div><div class="lab">In collaboration with</div>
      <div class="row"><img class="cadt" src="logo_cadt.png" alt="CADT"><span class="sep"></span><img class="aupp" src="logo_aupp_nextmake.png" alt="AUPP"><span class="sep"></span><img class="nm" src="logo_nextmake.png" alt="NEXT MAKE"></div>
    </div>
  </div>
</div></body></html>
