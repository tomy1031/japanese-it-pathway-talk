    show('このページは、共有されたリンクからだけ開けます。', 'This page opens only from the link that was shared with you.');
    return;
  }
  const bytes = s => {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  };
  try {
    const key = await crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
    const next = new DOMParser().parseFromString(new TextDecoder().decode(plain), 'text/html');
    document.replaceChild(document.adoptNode(next.documentElement), document.documentElement);
    // DOMParser で作ったスクリプトは実行されないので、作り直して順に実行する
    for (const old of document.querySelectorAll('script')) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  } catch (e) {
    show('リンクが途中で切れているようです。共有されたリンクをそのまま開いてください。', 'The link looks incomplete. Open the shared link exactly as it was sent.');
  }
})();
</script>
</body>
</html>
