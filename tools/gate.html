<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Page not found</title>
<style>
  :root { --bg: #ffffff; --ink: #24292f; --muted: #6e7781; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --ink: #e6edf3; --muted: #8b949e; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-align: center; }
  h1 { font-size: 64px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); font-size: 16px; }
</style>
</head>
<body>
<main id="msg"><h1>404</h1><p>There isn't a page here.</p></main>
<script>
(async () => {
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k) return;
  const P = { iv: '__IV__', ct: '__CT__' };
  const bytes = s => {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  };
  try {
    const key = await crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
    const next = new DOMParser().parseFromString(new TextDecoder().decode(plain), 'text/html');
    document.replaceChild(document.adoptNode(next.documentElement), document.documentElement);
    for (const old of document.querySelectorAll('script')) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  } catch (e) { /* wrong or cut key: keep the plain 404 */ }
})();
</script>
</body>
</html>
