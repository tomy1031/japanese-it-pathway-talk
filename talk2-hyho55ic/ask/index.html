<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FF4D6D">
<title>Ask Mr. Sato</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--ink:#14213D;--muted:#56627A;--line:#E7EBF3;--bg:#F6F7FB;--card:#fff;--coral:#FF4D6D;--orange:#FF8E3C;--mint:#12B886;
  --grad:linear-gradient(95deg,#FF4D6D 0%,#FF8E3C 100%);--font:'Plus Jakarta Sans','Khmer Sangam MN','Khmer MN','Khmer UI','Noto Sans Khmer','Hiragino Sans','Noto Sans JP',system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
.kicker{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral)}
.kicker::before{content:"";width:28px;height:3px;border-radius:3px;background:var(--grad)}
h1{font-size:30px;line-height:1.12;letter-spacing:-.03em;margin:10px 0 18px;font-weight:800}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brief{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 20px;box-shadow:0 12px 30px rgba(20,33,61,.08)}
.who{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:14px;background:linear-gradient(120deg,#2F7BFF,#7C5CFF);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.who .nm b{display:block;font-size:16px}.who .nm span{display:block;font-size:13px;color:var(--muted)}
.quote{position:relative;margin:0;font-size:17px;line-height:1.55;font-weight:600;background:#F1F5FF;border-radius:16px;padding:14px 16px}
.fict{font-size:11px;color:#8A93A6;margin-top:10px}
form{margin-top:22px}
label{display:block;font-weight:800;font-size:15px;margin:0 0 8px}
textarea{width:100%;min-height:118px;resize:vertical;border:2px solid var(--line);border-radius:18px;padding:14px 16px;font:500 17px/1.5 var(--font);color:var(--ink);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:#FF9AAD;box-shadow:0 0 0 4px rgba(255,77,109,.12)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
button{appearance:none;border:0;width:100%;margin-top:14px;padding:17px 20px;border-radius:999px;background:var(--grad);color:#fff;font:800 17px var(--font);letter-spacing:.01em;box-shadow:0 14px 30px rgba(255,77,109,.32);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,opacity .2s}
button:active{transform:scale(.98)}
button[disabled]{opacity:.55;box-shadow:none}
.tips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tips span{font-size:12.5px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px}
#msg{min-height:22px;margin-top:12px;font-size:14px;font-weight:700;text-align:center}
#msg.ok{color:var(--mint)}#msg.err{color:#D61F45}
.sent{margin-top:26px}
.sent h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between}
.sent ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sent li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px 11px 40px;font-size:15px;line-height:1.45;position:relative;animation:pop .5s cubic-bezier(.2,.85,.25,1)}
.sent li::before{content:"✓";position:absolute;left:12px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--mint);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.sent .none{color:#8A93A6;font-size:14px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.test{display:none;width:fit-content;margin-bottom:14px;font-size:12px;font-weight:800;color:#7A5300;background:#FFF3CF;border-radius:10px;padding:6px 10px}
</style>
</head>
<body>
<main>
  <div class="test" id="test"></div>
  <div class="kicker">Question time</div>
  <h1>What would you ask <span class="g">Mr. Sato?</span></h1>

  <section class="brief" aria-label="The client's request">
    <div class="who"><span class="av">S</span><span class="nm"><b id="person">Mr. Sato</b><span id="role">Project Manager · AEONA Mall 4</span></span></div>
    <p class="quote" id="request"></p>
    <div class="fict">AEONA Mall 4 is a fictional scenario for today’s exercise.</div>
  </section>

  <form id="f" autocomplete="off">
    <label for="q">Your question for the client</label>
    <textarea id="q" maxlength="300" placeholder="Type one question…" required></textarea>
    <div class="row"><span>English or Khmer is OK.</span><span id="len">0 / 300</span></div>
    <button id="send" type="submit">Send my question</button>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="tips"><span>One question per send</span><span>Ask as many as you like</span><span>No names needed</span></div>
  </form>

  <section class="sent">
    <h2><span>Your questions</span><span id="cnt">0</span></h2>
    <ol id="list"><li class="none" style="padding-left:14px;animation:none">Nothing sent yet.</li></ol>
  </section>
</main>
<script src="../live/config.js"></script>
<script>
(() => {
  const C = window.LIVEQ, S = C.session();
  const $ = id => document.getElementById(id);
  $('request').textContent = '“' + C.client.request + '”';
  $('person').textContent = C.client.person;
  $('role').textContent = C.client.role + ' · ' + C.client.company;
  if (S !== C.defaultSession) { $('test').style.display = 'block'; $('test').textContent = 'Practice session: ' + S; }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let pid = store.get('liveq-pid');
  if (!pid) { pid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store.set('liveq-pid', pid); }
  const sentKey = 'liveq-sent-' + S;
  let sent = [];
  try { sent = JSON.parse(store.get(sentKey) || '[]'); } catch (e) { sent = []; }

  function renderSent() {
    $('cnt').textContent = sent.length;
    const ol = $('list');
    if (!sent.length) return;
    ol.innerHTML = '';
    sent.slice().reverse().forEach(t => { const li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
  }
  renderSent();

  const q = $('q');
  q.addEventListener('input', () => { $('len').textContent = q.value.length + ' / 300'; });

  async function postQuestion(payload) {
    let lastErr;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const r = await fetch(C.fn, {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + C.anon, 'apikey': C.anon },
          body: JSON.stringify(payload)
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) throw new Error(j.message || ('Server error (' + r.status + '). Please try again.'));
        return j;
      } catch (err) {
        lastErr = err;
        const isNet = err && (err.name === 'TypeError' || /load failed|failed to fetch|network/i.test(String(err.message || '')));
        if (isNet && attempt === 0) {
          await new Promise(res => setTimeout(res, 650));
          continue;
        }
        throw err;
      }
    }
    throw lastErr;
  }

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const text = q.value.replace(/\s+/g, ' ').trim();
    const msg = $('msg');
    if (text.length < 2) { msg.className = 'err'; msg.textContent = 'Please type a question first.'; return; }
    $('send').disabled = true; msg.className = ''; msg.textContent = 'Sending…';
    try {
      await postQuestion({ session: S, participant: pid, text });
      sent.push(text); store.set(sentKey, JSON.stringify(sent)); renderSent();
      q.value = ''; $('len').textContent = '0 / 300';
      msg.className = 'ok';
      msg.textContent = sent.length === 1 ? 'Sent! Can you think of another one?' : 'Sent! ' + sent.length + ' questions so far. Keep going!';
    } catch (err) {
      msg.className = 'err';
      const m = String((err && err.message) || '');
      msg.textContent = /load failed|failed to fetch/i.test(m)
        ? 'Connection failed (server may be waking up or offline). Please tap Send again.'
        : (m || 'Could not send. Please try again.');
    } finally {
      $('send').disabled = false;
    }
  });
})();
</script>
</body>
</html>
